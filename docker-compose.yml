# Dev local et tests e2e. En prod, Coolify construit chaque Dockerfile séparément.
services:
  pb:
    build: ./apps/pb
    ports: ["8090:8090"]
    volumes:
      - pb_data:/pb/pb_data
      - ./apps/pb/pb_migrations:/pb/pb_migrations
      - ./apps/pb/pb_hooks:/pb/pb_hooks
    environment:
      SITE_URL_FOR_PURGE: http://localhost:4321
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["4321:4321"]
    environment:
      PB_INTERNAL_URL: http://pb:8090
      PUBLIC_PB_URL: http://localhost:8090
      SITE_URL: http://localhost:4321
    depends_on: [pb]
volumes:
  pb_data:
